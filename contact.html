<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Vanta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">V</span>
                Vanta <span>Luxery</span>
            </a>
            
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
    </nav>

    <section class="section">
        <h2 class="section-title heading-font">Get in Touch</h2>
        <div style="max-width:700px; margin:0 auto; text-align:center;">
            <p style="font-size:1.3rem; margin-bottom:2rem;">Our support is ready to help you with all your problems</p>
            
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:2rem; margin-top:3rem;">
                <div>
                    <i class="fas fa-phone fa-2x" style="color:var(--primary);" onclick="alert('You have contacted us')"></i>
                    <h3>+1 (555) 123-4567</h3>
                    <p>24/7 Support</p>
                </div>
                <div>
                    <i class="fas fa-envelope fa-2x" style="color:var(--primary);"></i>
                    <h3>hello@VantaLuxery.com</h3>
                    <p>Response within 4 hours</p>
                </div>
            </div>

            <form style="margin-top:3rem;">
                <input type="text" placeholder="Your Name" required style="width:100%; padding:15px; margin:10px 0; border-radius:12px;" id="name">
                <input type="email" placeholder="Email Address" required style="width:100%; padding:15px; margin:10px 0; border-radius:12px;" id="email">
                <textarea placeholder="Tell us about your dream trip..." rows="5" style="width:100%; padding:15px; margin:10px 0; border-radius:12px;"></textarea>
                <button type="submit"
                        style="padding:16px 40px; background:var(--primary); color:white; border:none; border-radius:9999px; font-size:1.1rem;">
                    Send Message
                </button>
            </form>
        </div>
    </section>

    <form onsubmit="return validation()">
        <div class="name-container">
            <label for="name" id="name_label">Name:</label>
            <input type="text" name="name" id="name">
            <span id="name_error">Please enter a valid name</span>
        </div>
        <br>
        <div class="email-container">
            <label for="email" id="email-label">Email:</label>
            <input type="text" name="email" id="email">
            <span id="email_error">Please enter a valid email</span>
        </div>
        <button type="submit" name="submit">Send</button>
    </form>

    <script src="main-contact.js"></script>

</body>
</html>
