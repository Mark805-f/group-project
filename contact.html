
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Vanta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">V</span>
                Vanta <span>Luxery</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <h2 class="section-title heading-font">Get in Touch</h2>

        <div style="max-width:700px; margin:0 auto; text-align:center;">

            <p style="font-size:1.3rem; margin-bottom:2rem;">
                Our support is ready to help you with all your problems.
            </p>

            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:2rem; margin-top:3rem;">

                <div>
                    <h3>+1 (555) 123-4567</h3>
                    <p>24/7 Support</p>
                </div>

                <div>
                    <h3>hello@VantaLuxery.com</h3>
                    <p>Response within 4 hours</p>
                </div>

            </div>

            <form id="contactForm" style="margin-top:3rem;">

                <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Your Name"
                    required
                    style="width:100%; box-sizing:border-box; padding:15px; margin:10px 0; border-radius:12px;"
                >

                <span id="name_error" style="visibility:hidden; color:red;">
                    Please enter a valid name using letters only.
                </span>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Email Address"
                    required
                    style="width:100%; box-sizing:border-box; padding:15px; margin:10px 0; border-radius:12px;"
                >

                <span id="email_error" style="visibility:hidden; color:red;">
                    Please enter a valid email address.
                </span>

                <textarea
                    name="message"
                    id="message"
                    placeholder="Tell us about your dream trip..."
                    rows="5"
                    required
                    style="width:100%; box-sizing:border-box; padding:15px; margin:10px 0; border-radius:12px;"
                ></textarea>

                <button
                    type="submit"
                    style="padding:16px 40px; background:var(--primary); color:white; border:none; border-radius:9999px; font-size:1.1rem;"
                >
                    Send Message
                </button>

            </form>

        </div>
    </section>

    <script src="js/main-contact.js"></script>

</body>
</html>
